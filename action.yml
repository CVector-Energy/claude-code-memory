name: 'Claude Code memory'
description: >
  Restore the repo-wide Claude Code auto-memory store, and save it back when the job finishes — whether the job passed or failed. Use this once, before the step that runs Claude Code. There is no companion save action.

inputs:
  snapshot:
    description: >
      Take a copy of the restored store before the agent runs, so a caller that must not persist this run's edits can roll back to it (see `snapshot-path`). Off by default: the whole point is that the agent's edits persist.
    required: false
    default: 'false'

outputs:
  path:
    description: Absolute path of this workspace's memory directory.
  found:
    description: '"true" when a store was restored and it contains at least one memory.'
  count:
    description: Number of memory files restored.
  snapshot-path:
    description: >
      Where the pre-run copy of the store was written, when `snapshot` is enabled. Copy it back over `path` to persist the store as it was before this run.

# A JavaScript action rather than a composite one, for one reason: only a
# JavaScript action can declare its own post step, and only `post-if: always()`
# saves the store when the job is already failing. `actions/cache` hardcodes
# `post-if: success()`, and its `save-always` input is documented as not working,
# so a composite wrapper around it could never save on a failing job — often the
# run whose memories matter most.
runs:
  using: node24
  main: dist/restore.mjs
  post: dist/save.mjs
  post-if: always()

branding:
  icon: database
  color: orange
